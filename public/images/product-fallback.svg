<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="Ảnh sản phẩm đang cập nhật">
  <defs>
    <pattern id="stripes" width="32" height="32" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="32" height="32" fill="#F7F4EF"/>
      <rect width="16" height="32" fill="#EFEAE1"/>
    </pattern>
  </defs>
  <rect width="480" height="480" fill="url(#stripes)"/>
  <rect x="70" y="198" width="340" height="84" rx="12" fill="#F7F4EF" fill-opacity=".92"/>
  <text x="240" y="247" text-anchor="middle" fill="#6B6B66" font-family="Arial,sans-serif" font-size="18">Ảnh sản phẩm đang cập nhật</text>
</svg>

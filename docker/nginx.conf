# Template: entrypoint thay ${PORT} bằng envsubst rồi ghi ra /etc/nginx/http.d/default.conf
server {
    listen 0.0.0.0:${PORT};
    server_name _;

    root /var/www/public;
    index index.php;
    charset utf-8;
    server_tokens off;

    # Đánh giá có ảnh (tối đa 5 ảnh x 2MB/sản phẩm) + avatar -> cho phép body lớn hơn mặc định 1MB
    client_max_body_size 32m;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Tệp tĩnh (kể cả /storage/... qua symlink) — cache trình duyệt 7 ngày
    location ~* \.(?:css|js|map|jpe?g|png|gif|webp|avif|svg|ico|woff2?|ttf|mp4|webm)$ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    # Only the Laravel front controller may execute PHP.
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

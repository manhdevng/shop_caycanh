expose_php=Off
display_errors=Off
log_errors=On
error_log=/proc/self/fd/2
memory_limit=128M
upload_max_filesize=8M
post_max_size=32M
max_file_uploads=20
max_execution_time=60
date.timezone=UTC
opcache.enable=1
opcache.validate_timestamps=0
opcache.memory_consumption=64
opcache.max_accelerated_files=10000

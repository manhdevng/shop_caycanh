[www]
listen = 127.0.0.1:9000
; giữ biến môi trường của Render cho worker PHP (DB_*, APP_KEY, ...)
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
; Render Free chỉ có 512MB RAM -> ít worker, sinh theo nhu cầu
pm = ondemand
pm.max_children = 3
pm.process_idle_timeout = 10s
pm.max_requests = 500
